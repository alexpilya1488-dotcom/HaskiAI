<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🐺 Husky AI</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="app">

    <header class="header">

        <div class="logoBox">

            <div class="glow"></div>

            <img
            src="FF459F14-284F-468D-9500-F368B35ECED6.png"
            class="logo"
            alt="Husky AI">
          <div class="eyes">
    <div class="eye left"></div>
    <div class="eye right"></div>
</div>

        </div>

        <h1>Husky AI</h1>

        <p>Искусственный интеллект нового поколения</p>

    </header>

    <main id="messages" class="messages">

        <div class="message ai">
            👋 Привет! Я Husky AI.

            <br><br>

            Задай мне любой вопрос.
        </div>

    </main>

    <footer class="inputBox">

        <input
        id="input"
        type="text"
        autocomplete="off"
        placeholder="Введите сообщение...">

        <button
        id="send"
        title="Отправить">

            ➜

        </button>

    </footer>

</div>

<script src="script.js"></script>

</body>
</html>
