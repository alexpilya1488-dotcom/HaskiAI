<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🐺 Husky AI</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div id="boot" class="boot">

    <div class="bootRing"></div>

    <img
    src="FF459F14-284F-468D-9500-F368B35ECED6.png"
    class="bootLogo"
    alt="Husky AI">

    <h1>HUSKY AI</h1>

    <h2 class="only">☠ ТОЛЬКО ДЛЯ СВОИХ ☠</h2>

    <p id="bootText" class="bootText">Запуск ядра...</p>

    <div class="loader">
        <div id="progress" class="progress"></div>
    </div>

    <p id="bootPercent" class="bootPercent">0%</p>

</div>

<div class="app">

    <header class="header">

        <div class="logoBox" id="logoBox">

            <div class="glow"></div>

            <img
            src="FF459F14-284F-468D-9500-F368B35ECED6.png"
            class="logo"
            id="logo"
            alt="Husky AI">

            <div class="eyes">
                <div class="eye left"></div>
                <div class="eye right"></div>
            </div>

        </div>

        <h1>Husky AI</h1>

        <p>Твой дружелюбный ИИ-помощник</p>

    </header>

    <main id="messages" class="messages">

        <div class="message ai">
            👋 Привет! Я Husky AI.
            <br><br>
            Спрашивай что угодно, могу посмотреть на картинку или послушать голосом 🎤
        </div>

    </main>

    <div id="imagePreview" class="imagePreview" hidden>
        <img id="previewImg" alt="preview">
        <button id="removeImage" class="removeImage" title="Убрать картинку">✕</button>
    </div>

    <footer class="inputBox">

        <input
        id="fileInput"
        type="file"
        accept="image/*"
        hidden>

        <button
        id="attach"
        class="iconBtn"
        title="Прикрепить картинку">📎</button>

        <button
        id="mic"
        class="iconBtn"
        title="Голосовой ввод">🎤</button>

        <input
        id="input"
        type="text"
        autocomplete="off"
        placeholder="Введите сообщение...">

        <button
        id="send"
        title="Отправить">➜</button>

    </footer>

</div>

<script src="script.js"></script>

</body>
</html>
