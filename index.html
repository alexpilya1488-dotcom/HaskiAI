<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>🐺 Husky AI</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div id="boot" class="boot">

    <div class="bootRing"></div>

    <img
    src="FF459F14-284F-468D-9500-F368B35ECED6.png"
    class="bootLogo"
    alt="Husky AI">

    <h1>HUSKY AI</h1>

    <h2 class="only">☠ ТОЛЬКО ДЛЯ СВОИХ ☠</h2>

    <p id="bootText" class="bootText">Запуск ядра...</p>

    <div class="loader">
        <div id="progress" class="progress"></div>
    </div>

    <p id="bootPercent" class="bootPercent">0%</p>

</div>

<div class="app">

    <header class="header">

        <button id="gameOpenBtn" class="headerGameBtn" title="Мини-игра">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                <circle cx="7" cy="7" r="2.1"/>
                <circle cx="12.3" cy="4.8" r="2.1"/>
                <circle cx="17.2" cy="7" r="2.1"/>
                <circle cx="19" cy="12" r="2.1"/>
                <path d="M12 10.2c2.6 0 5 2 5 4.6 0 2.1-1.6 3.4-3.4 3.1-.9-.15-1.1-.7-1.6-.7s-.7.55-1.6.7c-1.8.3-3.4-1-3.4-3.1 0-2.6 2.4-4.6 5-4.6z"/>
            </svg>
        </button>

        <div class="logoBox" id="logoBox">

            <div class="glow"></div>

            <img
            src="FF459F14-284F-468D-9500-F368B35ECED6.png"
            class="logo"
            id="logo"
            alt="Husky AI">

            <div class="eyes">
                <div class="eye left"></div>
                <div class="eye right"></div>
            </div>

        </div>

        <h1>Husky AI</h1>

        <p>Твой дружелюбный ИИ-помощник</p>

    </header>

    <main id="messages" class="messages">

        <div class="message ai">
            👋 Привет! Я Husky AI.
            <br><br>
            Спрашивай что угодно, могу посмотреть на картинку или послушать голосом 🎤
        </div>

    </main>

    <div id="imagePreview" class="imagePreview" hidden>
        <img id="previewImg" alt="preview">
        <button id="removeImage" class="removeImage" title="Убрать картинку">✕</button>
    </div>

    <footer class="inputBox">

        <input
        id="fileInput"
        type="file"
        accept="image/*"
        hidden>

        <button
        id="attach"
        class="iconBtn"
        title="Прикрепить картинку">📎</button>

        <button
        id="mic"
        class="iconBtn"
        title="Голосовой ввод">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="9" y="2" width="6" height="12" rx="3" stroke="currentColor" stroke-width="1.7"/>
                <path d="M5 11a7 7 0 0 0 14 0" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
                <path d="M12 18v3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
                <path d="M9 21h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
        </button>

        <input
        id="input"
        type="text"
        autocomplete="off"
        placeholder="Введите сообщение...">

        <button
        id="send"
        title="Отправить">
            <svg viewBox="0 0 24 24" width="21" height="21" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M4 12h15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <path d="M13 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>

    </footer>

</div>

<div id="gameOverlay" class="gameOverlay" hidden>

    <div class="gameTopBar">
        <span id="gameScore" class="gameScore">Пройдено мин: 0</span>
        <button id="gameClose" class="gameClose" title="Закрыть">✕</button>
    </div>

    <canvas id="gameCanvas" class="gameCanvas"></canvas>

    <button id="gameJumpBtn" class="gameJumpBtn">ПРЫЖОК</button>

    <div id="gameOverPanel" class="gameOverPanel" hidden>
        <div class="gameOverTitle">GAME OVER</div>
        <p id="gameOverScore" class="gameOverScore"></p>
        <button id="gameRestart" class="gameRestart">Играть снова</button>
        <button id="gameExit" class="gameExit">Выйти</button>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
